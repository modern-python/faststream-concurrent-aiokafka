name: checks
on:
  workflow_call: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install 3.13
      - run: uv python pin 3.13
      - run: just install lint-ci

  pytest:
    runs-on: ubuntu-latest
    env:
      # aiokafka ships no free-threaded wheel and its C codecs re-enable the GIL: use the pure-Python codecs on the t build.
      AIOKAFKA_NO_EXTENSIONS: ${{ matrix.python-version == '3.14t' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
    services:
      redpanda:
        image: redpandadata/redpanda:latest
        ports:
          - 9092:9092
        options: >-
          --health-cmd "rpk cluster health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv python pin ${{ matrix.python-version }}
      - run: uv sync
      - name: Confirm the interpreter is free-threaded
        if: matrix.python-version == '3.14t'
        run: uv run --no-sync python -c "import sys, faststream_concurrent_aiokafka; assert not sys._is_gil_enabled(), 'GIL is enabled on a t-build'"
      - run: just test-ci
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # --offline blocks network requests and excludes every external URL, so this gate
      # is deterministic: it fails only on a relative link or file path a diff broke.
      # Tag-pinned and cross-repo URLs do not match the --remap pattern and stay
      # excluded: they point at trees this checkout does not have.
      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --remap
            'https://github\.com/${{ github.repository }}/(?:blob|tree)/main/(.*) file://${{ github.workspace }}/$1'
            '**/*.md'
